plugins {
    id 'com.android.application'
}

// Keep the malformed recovered dependency tree out of the Java source set.
// Resource IDs are recovered into a generated source directory below, while
// Startup and ViewBinding retain their explicitly selected source directories.
def recoveredDependencySourceDir = file('../dependencies/src/main/java')
def recoveredResourceSourceDir = file("$buildDir/generated/recovered-resource-sources")

def recoveredResourceFiles = fileTree(recoveredDependencySourceDir) {
    include '**/R.java'
    exclude 'androidx/startup/R.java', 'androidx/viewbinding/R.java'
}

android {
    namespace 'nika.ngipro'
    compileSdk 33

    defaultConfig {
        applicationId 'nika.ngipro'
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName '2.1'
        // Keep AppCompat's vector drawable compatibility path enabled.
        vectorDrawables.useSupportLibrary = true
    }

    sourceSets {
        main {
            // Compile the app sources plus explicitly selected recovered
            // AndroidX sources. The remaining dependency tree is malformed
            // decompiler output and must not be compiled as application code.
            java {
                srcDirs = [
                        'src/main/java',
                        '../dependencies/src/main/java/androidx/viewbinding',
                        '../dependencies/src/main/java/androidx/startup',
                        recoveredResourceSourceDir
                ]
                // Full recovered Core runtime supplies this nested class.
                exclude 'androidx/core/content/res/ResourcesCompat$ThemeCompat.java'
            }
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// The recovered app already contains its library resources. Resolve the
// libraries for their classes, but extract only classes.jar from AARs so their
// duplicate resource trees are not merged a second time.
def embeddedLibraryDir = layout.buildDirectory.dir('generated/embedded-libraries')

configurations {
    embeddedLibraries
}

dependencies {
    embeddedLibraries 'androidx.appcompat:appcompat:1.6.1'
    embeddedLibraries 'androidx.cardview:cardview:1.0.0'
    embeddedLibraries 'androidx.constraintlayout:constraintlayout:2.1.4'
    embeddedLibraries 'androidx.drawerlayout:drawerlayout:1.1.1'
    embeddedLibraries 'androidx.recyclerview:recyclerview:1.3.1'
    embeddedLibraries 'com.google.android.material:material:1.9.0'
    // Keep the complete recovered AndroidX runtime closure on one extracted
    // classpath. These versions match the existing recovered artifact names.
    embeddedLibraries 'androidx.core:core:1.9.0'
    embeddedLibraries 'androidx.activity:activity:1.6.0'
    embeddedLibraries 'androidx.fragment:fragment:1.3.6'
    embeddedLibraries 'androidx.emoji2:emoji2:1.2.0'
    embeddedLibraries 'androidx.lifecycle:lifecycle-process:2.5.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'org.smali:dexlib2:2.5.2'

    // Compile and package the same extracted runtime class set. This keeps
    // Core, Activity, Fragment, Lifecycle, Emoji2 and their transitive
    // AndroidX classes available at runtime rather than compile-only.
    compileOnly fileTree(dir: embeddedLibraryDir.get().asFile, include: ['*.jar'])
    implementation fileTree(dir: embeddedLibraryDir.get().asFile, include: ['*.jar'])
}

tasks.register('extractEmbeddedLibraries') {
    inputs.files(configurations.embeddedLibraries)
    outputs.dir(embeddedLibraryDir)

    doLast {
        def outputDir = embeddedLibraryDir.get().asFile
        delete outputDir
        outputDir.mkdirs()

        configurations.embeddedLibraries.files.each { artifact ->
            if (artifact.name.startsWith("listenablefuture-") || artifact.name.startsWith("error_prone_annotations-")) {
                return
            }
            // Compile the recovered local Startup implementation below rather
            // than packaging a second startup-runtime implementation.
            if (artifact.name.startsWith('startup-runtime-')) {
                return
            }
            if (artifact.name.endsWith('.aar')) {
                def baseName = artifact.name.substring(0, artifact.name.length() - 4)
                copy {
                    from zipTree(artifact)
                    include 'classes.jar'
                    into outputDir
                    rename { "${baseName}.jar" }
                }
            } else if (artifact.name.endsWith('.jar')) {
                copy {
                    from artifact
                    into outputDir
                }
            }
        }
    }
}

tasks.register('verifyRecoveredRuntimeClosure') {
    dependsOn tasks.named('extractEmbeddedLibraries')

    doLast {
        def runtimeJars = fileTree(embeddedLibraryDir.get().asFile) {
            include '*.jar'
        }.files
        def requiredClasses = [
                'androidx/core/app/CoreComponentFactory.class',
                'androidx/core/app/ComponentActivity.class',
                'androidx/activity/ComponentActivity.class',
                'androidx/fragment/app/FragmentActivity.class',
                'androidx/appcompat/app/AppCompatActivity.class',
                'androidx/lifecycle/DefaultLifecycleObserver.class',
                'androidx/lifecycle/Lifecycle.class',
                'androidx/lifecycle/ProcessLifecycleInitializer.class',
                'androidx/emoji2/text/EmojiCompatInitializer.class',
                'androidx/emoji2/text/EmojiCompat.class'
        ]
        def missing = requiredClasses.findAll { classPath ->
            !runtimeJars.any { jar ->
                zipTree(jar).matching { include classPath }.files
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    'Recovered AndroidX runtime closure is missing: ' + missing.join(', ')
            )
        }

        def owners = [:].withDefault { [] }
        runtimeJars.each { jar ->
            zipTree(jar).visit { details ->
                if (!details.directory && details.path.endsWith('.class')) {
                    owners[details.path] << jar.name
                }
            }
        }
        def duplicateClasses = owners.findAll { entry, jars -> jars.size() > 1 }
        if (!duplicateClasses.isEmpty()) {
            def sample = duplicateClasses.collect { name, jars -> name + ' [' + jars.join(', ') + ']' }
                    .take(20)
            throw new GradleException(
                    'Duplicate extracted runtime classes: ' + sample.join('; ')
            )
        }
    }
}

tasks.register('prepareRecoveredResourceSources') {
    inputs.files(recoveredResourceFiles)
    inputs.file('src/main/res/values/public.xml')
    outputs.dir(recoveredResourceSourceDir)

    doLast {
        def publicAttrIds = [:]
        file('src/main/res/values/public.xml').eachLine { line ->
            def match = line =~ /<public\s+type="attr"\s+name="([^"]+)"\s+id="(0x[0-9a-fA-F]+)"/
            if (match.find()) {
                publicAttrIds[match.group(1)] = match.group(2)
            }
        }

        delete recoveredResourceSourceDir
        recoveredResourceFiles.each { sourceFile ->
            def relativePath = recoveredDependencySourceDir.toPath()
                    .relativize(sourceFile.toPath())
                    .toString()
            def destination = file(new File(recoveredResourceSourceDir, relativePath))
            destination.parentFile.mkdirs()

            // Decompiled library R.java styleable arrays refer to the merged
            // app R.attr fields. Keep the recovered APK IDs but replace those
            // references with their literal IDs so no synthetic app attrs need
            // to be re-declared in resources.
            def sourceText = sourceFile.getText('UTF-8')
            sourceText = sourceText.replaceAll(
                    /nika\.ngipro\.R\.attr\.([A-Za-z_][A-Za-z0-9_]*)/
            ) { fullMatch, name ->
                publicAttrIds.containsKey(name) ? publicAttrIds[name] : fullMatch
            }
            destination.setText(sourceText, 'UTF-8')
        }
    }
}

// Keep the historical compatibility-JAR validation artifact available.
// The APK runtime now uses the complete recovered Core class set above; this
// filtered JAR is not placed on the runtime classpath.
def recoveredCoreRuntimeJars = {
    fileTree(embeddedLibraryDir.get().asFile).matching {
        include 'core-1.9.0.jar'
    }.files
}

tasks.register('packageCoreResourcesCompat', Jar) {
    archiveFileName.set('core-resources-compat.jar')
    destinationDirectory.set(layout.buildDirectory.dir('generated/core-resources-compat'))
    dependsOn tasks.named('extractEmbeddedLibraries')
    from {
        def candidates = recoveredCoreRuntimeJars()
        if (candidates.isEmpty()) {
            throw new GradleException('Recovered core-1.9.0 runtime jar was not extracted.')
        }
        zipTree(candidates.first()).matching {
            include 'androidx/core/content/res/ResourcesCompat$ThemeCompat.class'
            include 'androidx/core/content/res/ResourcesCompat$ThemeCompat$*.class'
        }
    }
    doFirst {
        def candidates = recoveredCoreRuntimeJars()
        if (candidates.isEmpty()) {
            throw new GradleException('Recovered core-1.9.0 runtime jar was not extracted.')
        }
        def entries = zipTree(candidates.first()).matching {
            include 'androidx/core/content/res/ResourcesCompat$ThemeCompat.class'
        }.files
        if (entries.isEmpty()) {
            throw new GradleException(
                    'Recovered Core runtime does not contain ResourcesCompat$ThemeCompat.'
            )
        }
    }
}

// AGP registers variant assemble tasks after project evaluation; configure
// the finalizer lazily so Gradle 8.5 can create assembleDebug first.
tasks.configureEach { task ->
    if (task.name == 'assembleDebug') {
        task.finalizedBy tasks.named('packageCoreResourcesCompat')
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('extractEmbeddedLibraries')
    dependsOn tasks.named('prepareRecoveredResourceSources')
    dependsOn tasks.named('verifyRecoveredRuntimeClosure')
}
