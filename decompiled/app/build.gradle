plugins {
    id 'com.android.application'
}

// Keep the malformed recovered dependency tree out of the Java source set.
// Resource IDs are recovered into a generated source directory below, while
// Startup and ViewBinding retain their explicitly selected source directories.
def recoveredDependencySourceDir = file('../dependencies/src/main/java')
def recoveredResourceSourceDir = file("$buildDir/generated/recovered-resource-sources")

def recoveredResourceFiles = fileTree(recoveredDependencySourceDir) {
    include '**/R.java'
    exclude 'androidx/startup/R.java', 'androidx/viewbinding/R.java'
}

android {
    namespace 'nika.ngipro'
    compileSdk 33

    defaultConfig {
        applicationId 'nika.ngipro'
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName '2.1'
    }

    sourceSets {
        main {
            // Compile the app sources plus explicitly selected recovered
            // AndroidX sources. The remaining dependency tree is malformed
            // decompiler output and must not be compiled as application code.
            java {
                srcDirs = [
                        'src/main/java',
                        '../dependencies/src/main/java/androidx/viewbinding',
                        '../dependencies/src/main/java/androidx/startup',
                        recoveredResourceSourceDir
                ]
            }
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// The recovered app already contains its library resources. Resolve the
// libraries for their classes, but extract only classes.jar from AARs so their
// duplicate resource trees are not merged a second time.
def embeddedLibraryDir = layout.buildDirectory.dir('generated/embedded-libraries')

configurations {
    embeddedLibraries
}

dependencies {
    embeddedLibraries 'androidx.appcompat:appcompat:1.6.1'
    embeddedLibraries 'androidx.cardview:cardview:1.0.0'
    embeddedLibraries 'androidx.constraintlayout:constraintlayout:2.1.4'
    embeddedLibraries 'androidx.drawerlayout:drawerlayout:1.1.1'
    embeddedLibraries 'androidx.recyclerview:recyclerview:1.3.1'
    embeddedLibraries 'com.google.android.material:material:1.9.0'

    implementation 'androidx.annotation:annotation:1.7.1'
    // The recovered Startup initializer reaches ProcessLifecycleInitializer.
    // Supply its common/runtime lifecycle classes directly; the extracted
    // copies stay excluded below so these do not create duplicate classes.
    implementation 'androidx.lifecycle:lifecycle-runtime:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-common:2.5.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'org.smali:dexlib2:2.5.2'

    // Keep the complete AndroidX Core jar out of the APK. The runtime only
    // needs ResourcesCompat.ThemeCompat, which is added below as a narrowly
    // filtered compatibility jar. All extracted jars remain on the compile
    // classpath so the recovered source can resolve their classes.
    compileOnly fileTree(dir: embeddedLibraryDir.get().asFile, include: ['*.jar'])
    implementation fileTree(dir: embeddedLibraryDir.get().asFile, include: ['*.jar'], exclude: [
            'activity-1.6.0.jar',
            'annotation-experimental-1.3.0.jar',
            'core-1.9.0.jar',
            'core-runtime-2.1.0.jar',
            'customview-1.1.0.jar',
            'fragment-1.3.6.jar',
            'interpolator-1.0.0.jar',
            'lifecycle-livedata-2.0.0.jar',
            'lifecycle-livedata-core-2.5.1.jar',
            'lifecycle-runtime-2.5.1.jar',
            'lifecycle-viewmodel-2.5.1.jar',
            'lifecycle-viewmodel-savedstate-2.5.1.jar',
            'loader-1.0.0.jar',
            'savedstate-1.2.0.jar',
            'tracing-1.0.0.jar',
            'vectordrawable-1.1.0.jar',
            'vectordrawable-animated-1.1.0.jar',
            'versionedparcelable-1.1.1.jar',
            'viewpager-1.0.0.jar',
    ])
    implementation 'androidx.constraintlayout:constraintlayout-core:1.0.4'
}

tasks.register('extractEmbeddedLibraries') {
    inputs.files(configurations.embeddedLibraries)
    outputs.dir(embeddedLibraryDir)

    doLast {
        def outputDir = embeddedLibraryDir.get().asFile
        delete outputDir
        outputDir.mkdirs()

        configurations.embeddedLibraries.files.each { artifact ->
            if (artifact.name.startsWith("listenablefuture-") || artifact.name.startsWith("error_prone_annotations-")) {
                return
            }
            // Compile the recovered local Startup implementation below rather
            // than packaging a second startup-runtime implementation.
            if (artifact.name.startsWith('startup-runtime-')) {
                return
            }
            if (artifact.name.endsWith('.aar')) {
                def baseName = artifact.name.substring(0, artifact.name.length() - 4)
                copy {
                    from zipTree(artifact)
                    include 'classes.jar'
                    into outputDir
                                    rename { "${baseName}.jar" }
                }
            }
        }
    }
}

tasks.register('prepareRecoveredResourceSources') {
    inputs.files(recoveredResourceFiles)
    outputs.dir(recoveredResourceSourceDir)

    doLast {
        delete recoveredResourceSourceDir
        recoveredResourceFiles.each { sourceFile ->
            def relativePath = recoveredDependencySourceDir.toPath()
                    .relativize(sourceFile.toPath())
                    .toString()
            def destination = file(new File(recoveredResourceSourceDir, relativePath))
            destination.parentFile.mkdirs()
            destination.bytes = sourceFile.bytes
        }
    }
}

// The APK's recovered source contains the implementation of the missing
// ResourcesCompat.ThemeCompat nested class. It is rebuilt as the binary class
// name ResourcesCompat$ThemeCompat, so no external Core JAR is required.
// The complete Core JAR remains compile-only and excluded from runtime.
def compatibilityClassPattern = {
    fileTree(layout.buildDirectory.get().asFile).matching {
        include '**/androidx/core/content/res/ResourcesCompat$ThemeCompat.class'
        include '**/androidx/core/content/res/ResourcesCompat$ThemeCompat$*.class'
    }
}

tasks.register('packageCoreResourcesCompat', Jar) {
    archiveFileName.set('core-resources-compat.jar')
    destinationDirectory.set(layout.buildDirectory.dir('generated/core-resources-compat'))
    dependsOn 'compileDebugJavaWithJavac'

    // Search the compiled build tree because AGP can change the JavaCompile
    // output directory between versions. Rewrite the path so the generated
    // JAR contains only the AndroidX package path.
    from(layout.buildDirectory) {
        include '**/androidx/core/content/res/ResourcesCompat$ThemeCompat.class'
        include '**/androidx/core/content/res/ResourcesCompat$ThemeCompat$*.class'
        eachFile { details ->
            def marker = 'androidx/core/content/res/'
            def markerIndex = details.path.indexOf(marker)
            if (markerIndex >= 0) {
                details.path = details.path.substring(markerIndex)
            }
        }
    }

    doFirst {
        def classes = compatibilityClassPattern().files
        if (!classes.any { it.name == 'ResourcesCompat$ThemeCompat.class' }) {
            throw new GradleException(
                    'The APK-only ThemeCompat compatibility source did not compile.'
            )
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('extractEmbeddedLibraries')
    dependsOn tasks.named('prepareRecoveredResourceSources')
}

tasks.configureEach { task ->
    if (task.name == 'assembleDebug') {
        task.finalizedBy tasks.named('packageCoreResourcesCompat')
    }
}
